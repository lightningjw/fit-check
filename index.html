<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one 720px column under a ribbon of the wearer's palette; fixed five-tab bar below. */
  --paper:#EEEEEA; --card:#FAFAF7; --ink:#17171A; --mute:#636368; --line:#D6D5CF; --wash:#E3E2DC;
  --accent:#17171A; --ok:#2F6B4F; --warn:#8A5D0C; --bad:#A1362B;
  --display:"Bodoni Moda","Didot","Bodoni MT",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#111113;--card:#1A1A1D;--ink:#ECEBE6;--mute:#9D9DA2;--line:#2E2E32;--wash:#232326;--ok:#7CC0A0;--warn:#D9AE5A;--bad:#E69084;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#111113;--card:#1A1A1D;--ink:#ECEBE6;--mute:#9D9DA2;--line:#2E2E32;--wash:#232326;--ok:#7CC0A0;--warn:#D9AE5A;--bad:#E69084;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:96px;-webkit-text-size-adjust:100%}
img{max-width:100%}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:italic 500 44px/1 var(--display);letter-spacing:-.01em}
h2{font:500 24px/1.15 var(--display)}
h3{font:600 12px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
p{margin:0}
a{color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--paper)}
#ribbon{display:flex;height:7px;background:var(--wash)}
#ribbon i{flex:1}
.bar{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.mark{font:italic 600 22px/1 var(--display)}
#season-tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:0 16px}
#notice{font-size:13px;color:var(--mute);padding:10px 0 0}
#notice:empty{display:none}
#view{display:flex;flex-direction:column;gap:22px;padding:22px 0}
.head{display:flex;flex-direction:column;gap:8px}
.head h1::after{content:"";display:block;width:44px;height:3px;background:var(--accent);margin-top:14px}
.sub{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

/* controls */
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:600 14px/1 var(--body);padding:12px 16px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:8px 11px;min-height:34px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
label.btn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);flex:1 1 150px;min-width:0}
.f input,.f select,.f textarea,.plain{font:400 16px/1.35 var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:2px;padding:10px 11px;width:100%}
.f textarea{resize:vertical;min-height:64px}
.grid2{display:flex;flex-wrap:wrap;gap:12px}
.hint{font-size:13px;color:var(--mute)}
.hint:empty{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{border:1px dashed var(--line);border-radius:3px;padding:26px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font-style:italic}
.empty p{color:var(--mute);max-width:52ch}
.walk ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.walk li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.walk .n{font:italic 500 18px/1 var(--display);width:22px;flex:none;color:var(--mute)}
.walk li.done{color:var(--mute);text-decoration:line-through}
.walk li.now .n{color:var(--ink)}
.walk li.now{font-weight:600}

/* palette */
.pal{display:flex;flex-direction:column;gap:10px}
.pal .g{display:flex;align-items:center;gap:10px}
.pal .g span{width:62px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);flex:none}
.sw{display:flex;flex-wrap:wrap;gap:5px}
.sw i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:block}
.pal .avoid i{position:relative;opacity:.85}
.pal .avoid i::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:var(--card);transform:rotate(-45deg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:3px 8px 3px 6px;white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.pill.off{border-style:dashed;color:var(--bad);border-color:var(--bad)}
.pill.off i{background:transparent;border:1.5px solid var(--bad)}
.pill.good{color:var(--ok);border-color:var(--ok)}.pill.good i{background:var(--ok)}
.pill.adapt{color:var(--warn);border-color:var(--warn)}.pill.adapt i{background:var(--warn)}

/* closet grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.item .im{aspect-ratio:4/5;background:var(--wash);display:block;width:100%;object-fit:cover}
.item .tx{padding:9px 10px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.item b{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.item small{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:2px;padding:2px 7px;color:var(--mute)}

/* flat-lay */
.lay{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:50px;grid-auto-flow:dense;gap:9px;padding:16px;background:var(--wash);border-radius:3px}
.t{position:relative;overflow:hidden;border-radius:2px;background:var(--card);box-shadow:0 10px 18px -12px rgba(0,0,0,.5);grid-column:span 2;grid-row:span 2}
.t:nth-child(odd){transform:rotate(-1.1deg)}.t:nth-child(even){transform:rotate(.8deg)}
.t img,.t .blk{width:100%;height:100%;object-fit:cover;display:block}
.t span{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:1.25;padding:4px 6px;background:var(--card);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.outerwear,.t.bottom{grid-column:span 3;grid-row:span 4}
.t.top,.t.one-piece{grid-column:span 3;grid-row:span 3}
.t.shoes{grid-column:span 3;grid-row:span 2}
.outfit .why{font:italic 400 19px/1.35 var(--display)}
.kv{font-size:14px}.kv b{font-weight:600}

/* taste */
.pat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.pat .cnt{font:italic 500 20px/1 var(--display);font-variant-numeric:tabular-nums}
.pat .meter{grid-column:1/-1;height:3px;background:var(--wash)}
.pat .meter i{display:block;height:100%;background:var(--accent)}
.pat p{grid-column:1/-1;font-size:13px;color:var(--mute)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line)}
nav.tabs div{max-width:720px;margin:0 auto;display:flex}
nav.tabs button{flex:1;appearance:none;background:none;border:0;border-top:3px solid transparent;color:var(--mute);font:500 11px/1 var(--body);letter-spacing:.06em;padding:9px 2px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* sheet, busy, toast */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#scrim.open{display:flex}
#sheet{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:10px 10px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:14px}
#sheet form{display:flex;flex-direction:column;gap:14px}
#sheet .ph{width:140px;aspect-ratio:4/5;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
@media(min-width:600px){#scrim{align-items:center}#sheet{border-radius:6px}}
#busy{position:fixed;left:0;right:0;bottom:74px;z-index:35;display:none;justify-content:center;padding:0 16px;pointer-events:none}
#busy.open{display:flex}
#busy div{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:3px;padding:10px 12px;display:flex;gap:12px;align-items:center;font-size:14px;max-width:560px;width:100%}
#busy b{font-weight:600}#busy span{opacity:.75;flex:1;min-width:0}
#busy button{appearance:none;background:none;border:1px solid currentColor;color:inherit;font:600 12px var(--body);padding:6px 10px;border-radius:2px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper);animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
#toast{position:fixed;left:16px;right:16px;top:64px;z-index:50;display:none;justify-content:center;pointer-events:none}
#toast.open{display:flex}
#toast p{background:var(--card);border:1px solid var(--ink);padding:10px 14px;border-radius:3px;font-size:14px;max-width:520px;box-shadow:0 12px 24px -14px rgba(0,0,0,.5)}
.stars{display:flex;gap:6px}
.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.warn i{background:var(--warn)}
.cks{display:flex;flex-direction:column;gap:2px}.cks.scroll{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:2px;padding:4px 10px;background:var(--card)}
.ck{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0;cursor:pointer}.ck input{width:20px;height:20px;flex:none;accent-color:var(--ink)}
.mini{width:36px;height:45px;object-fit:cover;border-radius:2px;display:block;flex:none;background:var(--wash);border:1px solid var(--line)}.mini.big{width:72px;height:90px}
.stamp{font:italic 600 30px/1 var(--display)}.stamp.good{color:var(--ok)}.stamp.adapt{color:var(--warn)}.stamp.off{color:var(--bad)}
details summary{cursor:pointer;font-size:14px;padding:6px 0;color:var(--mute)}
.fbrow{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.fbrow .meta{font-size:12px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.fbrow p{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:420px){h1{font-size:38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.t{transform:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<body>
<header class="top">

<main>
  <p id="notice" role="status"></p>

<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const day=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const withTimeout=(p,ms)=>{let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej({code:'timeout'}),ms)})]).finally(()=>clearTimeout(t))};

/* ---------- reference data ---------- */
const SRC={
'Light Spring':'Peach#F9C7A4,Buttercup#F8E08E,Mint#A8DDB5,Aqua#7FD3CC,Coral pink#F59A8C|Warm coral#FF7F66,Turquoise#36BDB0,Sunflower#F2B632,Periwinkle#8FA4E8|Ivory#F6EEDC,Camel#C9A777,Dove taupe#AFA393,Light navy#4F6D8F|Black#111111,Burgundy#5A1230,Charcoal#33363B,Dusty mauve#8E6F7E',
'True Spring':'Golden yellow#F5B82E,Coral#FF6F50,Leaf green#5DAA47,Turquoise#1FB5AD,Apricot#F9A45C|Poppy#E8432E,Kelly green#2E9E4F,Bright aqua#19B7CE,Warm violet#8558B5|Cream#F5E9CF,Golden tan#C99A5B,Warm brown#7A5230,Clear navy#2C4A7C|Black#111111,Cool pink#D98BB0,Icy grey#C7CCD4,Plum#5B2A52',
'Bright Spring':'Hot coral#FF5A4D,Lime#A4D233,Bright turquoise#00B4C5,Daffodil#FFD23F,Warm pink#F2578C|Poppy red#E62E2D,Emerald#0F9E62,Cobalt#1F5FD0,Violet#7A3FC2|Soft white#F7F2E8,Warm grey#9A938A,Chocolate#4E3524,Bright navy#1F2F6B|Dusty rose#B58A8E,Sage#94A187,Mushroom#A3948A,Muted mauve#8C7386',
'Light Summer':'Powder blue#A9C9E8,Rose pink#EBA8BD,Lavender#BDB0E0,Seafoam#A5D8CB,Soft lemon#F3EBA6|Raspberry sorbet#D9577E,Periwinkle#7F92D9,Jade#4FAF9B,Watermelon#F06B7E|Soft white#F3F1EC,Light grey#C4C8CE,Rose beige#C9B2A6,Grey navy#4C5D7A|Black#111111,Orange#E8731A,Mustard#C9982B,Rust#9A4521',
'True Summer':'Slate blue#5F7FA6,Rose#C7607F,Soft fuchsia#B8528F,Sea green#4C9B8F,Lavender blue#8D93C9|Raspberry#B32E5E,Teal#1F7F86,Plum#7A3F78,Cornflower#5F86D6|Soft white#EEF0F1,Blue grey#8D99A8,Cocoa#6E5A5A,Navy#27365A|Orange#E8731A,Golden yellow#EDB321,Camel#C49A5E,Tomato red#D9412A',
'Soft Summer':'Dusty rose#C08A93,Mauve#9E7C97,Grey blue#7C93A8,Sage#8FA595,Soft teal#5F8E8C|Soft burgundy#8A4257,Dusky plum#6E4C6F,Jade#4E8C7E,Denim#50709A|Oyster#E3DDD3,Stone grey#9C9A96,Taupe#8A7B73,Charcoal blue#3F4A59|Black#111111,Neon orange#FF6A13,Bright yellow#FFD400,Hot pink#FF2E93',
'Soft Autumn':'Dusty olive#8F8B5E,Terracotta rose#C48672,Soft teal#5E8A84,Wheat#D9BE8C,Salmon#E09F86|Rust#A65A3A,Moss#6E7B3F,Deep teal#2F6E6B,Aubergine#5E3F52|Oatmeal#E6DAC3,Khaki#B5A27F,Mushroom brown#8C7560,Coffee#4F3C2E|Black#111111,Fuchsia#D61C8C,Icy blue#CDE4F5,Pure white#FFFFFF',
'True Autumn':'Pumpkin#D9772B,Mustard#C9982B,Olive#70762D,Rust#A84B24,Teal#1F7A78|Tomato#C93B22,Forest#2F5E37,Deep turquoise#17858A,Golden yellow#E0A526|Cream#F1E4C8,Camel#BF9358,Bronze brown#7A5230,Dark chocolate#3E2A1C|Black#111111,Cool pink#E08BB5,Icy lavender#D5CCF0,Blue grey#8D99A8',
'Deep Autumn':'Oxblood#6E1F1F,Forest green#23482E,Rust#9C4521,Deep teal#114F52,Mustard gold#B8862B|Tomato red#B8321F,Burnt orange#C4621C,Aubergine#4A2540,Pine emerald#1B6B4A|Cream#EFE3CC,Camel#B88C55,Espresso#36241A,Olive black#2C2B22|Pastel pink#F4C6D7,Icy blue#CDE4F5,Lavender#C9BCE8,Cool grey#B5BAC2',
'Deep Winter':'Burgundy#6B1532,Pine green#0E4A3C,Navy#14244F,True red#C2152B,Royal purple#4B2A8A|Fuchsia#C71C7F,Emerald#0E8A5C,Cobalt#1E4FCB,Lemon ice#F2EFA0|Black#111111,Charcoal#33363B,Pure white#FFFFFF,Black brown#2B1E1A|Peach#F7BE9A,Camel#C49A5E,Dusty orange#D9905B,Sage#94A187',
'True Winter':'Royal blue#1F3FB0,Emerald#0B8F6A,Magenta#C2187A,True red#C8102E,Purple#5B2C9E|Hot pink#F0288C,Icy blue#C6E2F7,Lemon ice#F5F2A8,Cyan teal#008FA8|Black#111111,Pure white#FFFFFF,Cool grey#8E949E,Navy#17224D|Orange#E8731A,Mustard#C9982B,Rust#9A4521,Warm beige#D9BE98',
'Bright Winter':'Electric blue#1456E0,Hot pink#F0288C,Emerald#00A36C,True red#D0102A,Violet#6B2FD0|Acid lemon#F2E63D,Cyan#00B7D9,Fuchsia#D1179B,Kelly green#14A84B|Black#111111,Pure white#FFFFFF,Icy grey#D5D9DF,Charcoal#33363B|Dusty rose#B58A8E,Khaki#B5A27F,Rust#9A4521,Mushroom#A3948A'};
const GROUPS=['core','accent','neutral','avoid'];
const SEASONS={};
for(const[k,v]of Object.entries(SRC)){const o={};v.split('|').forEach((g,i)=>{o[GROUPS[i]]=g.split(',').map(c=>{const[name,hex]=c.split('#');return{name,hex:'#'+hex}})});SEASONS[k]=o}
const SEASON_NAMES=Object.keys(SEASONS);
const CATS=['top','bottom','one-piece','outerwear','shoes','accessory'];
const FITS=['core','accent','neutral','off-palette'];
const WEAR=['all','spring/summer','fall/winter'];
const METALS=['Yellow gold','Rose gold','Silver','Mixed metals'];
const BUDGETS=['tops','bottoms','outerwear','shoes','accessories'];
const CSV_COLS=['item_id','name','category','subcategory','primary_color','secondary_color','palette_fit','material','formality','season','brand','size','notes','price'];
const PRE={top:'TOP',bottom:'BTM','one-piece':'ONE',outerwear:'OUT',shoes:'SHO',accessory:'ACC'};
const HUES={black:'#161616',white:'#F4F4F0',cream:'#EFE3CC',ivory:'#F3ECDC',navy:'#1F2C4F',charcoal:'#3A3C40',grey:'#8E9196',gray:'#8E9196',brown:'#6B4A32',espresso:'#36241A',beige:'#D6C3A1',tan:'#C19A6B',camel:'#BF9358',khaki:'#B5A27F',olive:'#70762D',green:'#2F6B3F',teal:'#1F7A78',blue:'#2F5FA8',denim:'#4A6A94',red:'#B8281F',burgundy:'#6B1532',oxblood:'#6E1F1F',rust:'#A84B24',orange:'#D9772B',mustard:'#C9982B',yellow:'#E8C53A',gold:'#B8862B',pink:'#E79AB3',purple:'#5B2C9E',plum:'#5B2A52',silver:'#BFC3C8'};
const hueOf=n=>{n=String(n||'').toLowerCase();for(const k in HUES)if(n.includes(k))return HUES[k];return''};

/* ---------- state ---------- */
const S={view:'closet',phase:'boot',loadErr:'',uid:null,isOwner:false,
  profile:null,insights:{},items:[],inspo:[],outfits:[],wears:[],buy:{url:'',photo:''},buyResult:null,
  filters:{category:'',palette_fit:'',season:'',formality:'',wear:''},
  pdraft:null,oform:{occasion:'',temp:'',anchor:''},suggestion:null,selfie:null,

async function bitmap(file){

}
/* 600px long edge, JPEG 0.7; steps down further only if still over ~100 KB. */
async function shrink(file,edge=600,cap=133000){
  const bm=await bitmap(file),w=bm.width,h=bm.height;let q=0.7,url='';
  for(let i=0;i<7;i++){const k=Math.min(1,edge/Math.max(w,h)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
    url=c.toDataURL('image/jpeg',q);if(url.length<=cap)break;if(q>0.5)q-=0.1;else edge=Math.round(edge*0.85)}
  return url;
}

/* Every call is memoryless: the prompt carries instructions, data and the exact schema.
   The Anthropic key lives in /api/claude; the browser only sends the signed-in user's token. */
async function ask(label,prompt,{images,tier='default'}={}){
  if(!aiOK())throw{code:'not_allowed',handled:true};
  if(aiWait()){toast(`Claude needs a breather. Try again in ${aiWait()} seconds.`);throw{code:'rate_limited',handled:true}}
  if(S.ai.busy){toast('One request at a time. Wait for the current one to finish.');throw{code:'busy',handled:true}}
  S.ai.busy=true;ctl=new AbortController();busy(label,'Thinking…');
  try{
    const ses=(await sb.auth.getSession()).data.session;if(!ses)throw{code:'session_expired'};
    const r=await fetch('/api/claude',{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json',authorization:'Bearer '+ses.access_token},body:JSON.stringify({prompt,tier,images:images||[]})});
    const body=await r.json().catch(()=>({}));
    if(!r.ok)throw{code:body.code||'upstream_error',detail:body.detail||('HTTP '+r.status+(r.status===504?' (the server function timed out)':''))};
    const v=salvage(body.text);if(v===undefined)throw{code:body.truncated?'truncated':'invalid_json'};
    return v}
  catch(e){const c=e&&e.name==='AbortError'?'cancelled':(e&&e.code)||'upstream_error',err={code:c,handled:false};
    const say=m=>{toast(m);err.handled=true};
    if(c==='not_allowed'){S.ai.off=true;say("AI features aren't enabled for your account. Everything still works by hand.")}
    else if(c==='not_configured'){S.ai.off=true;say("AI isn't set up on this site yet"+(e.detail?' ('+e.detail+')':'')+'. Everything still works by hand.')}
    else if(c==='upstream_error')say('The AI call failed: '+(e.detail||'no response from the server')+'.');
    else if(c==='truncated')say("Claude's reply was cut off before it finished. Try again.");
    else if(c==='daily_limit')say("You've used today's AI calls. They reset at midnight UTC.");
    else if(c==='rate_limited'){S.ai.cool=Date.now()+90000;setTimeout(render,90500);say('Claude is rate-limited right now. The AI buttons come back in 90 seconds.')}
    else if(c==='session_expired')say('Your session expired. Sign in again, then retry.');
    else if(c==='too_large')say('That was too much to send at once. Try with fewer pieces or a smaller photo.');
    else if(c==='cancelled')err.handled=true;
    throw err}
  finally{S.ai.busy=false;ctl=null;busy();render()}
}

  if(!r||typeof r!=='object'||!VERDICT[r.verdict]){toast("The verdict didn't come back cleanly. Try again.");return}
  const price=Number(r.price)>0?Math.round(Number(r.price)*100)/100:(page&&Number(page.price)>0?Number(page.price):0);
  S.buyResult={item:normTag(r.item),price,verdict:r.verdict,headline:String(r.headline||'').slice(0,240),palette_note:String(r.palette_note||'').slice(0,160),duplicates:validIds(r.duplicates).slice(0,4),duplicate_note:String(r.duplicate_note||'').slice(0,160),unlocks:Math.max(0,Math.round(Number(r.unlocks))||0),pairs_with:validIds(r.pairs_with).slice(0,6),budget_note:String(r.budget_note||'').slice(0,160),photo:photo||'',url};
  S.buy={url:'',photo:''};S.insights={...S.insights,checks:[{name:S.buyResult.item.name||'Unnamed piece',verdict:r.verdict,at:Date.now()},...(S.insights.checks||[])].slice(0,10)};render();
  try{await save(P.insights(),S.insights)}catch(e){}}

/* ---------- Profile ---------- */
const blankProfile=()=>({season:'',metals:'',department:'',style:'',height:'',build:'',measurements:'',sizes:'',fit_problems:'',budgets:{},hard_nos:''});
function profileView(){if(!S.pdraft)S.pdraft={...blankProfile(),...(S.profile||{}),budgets:{...((S.profile||{}).budgets||{})}};const d=S.pdraft,e=S.selfie;
  return`<div class="head"><h1>Profile</h1><p class="sub">${S.profile?'Private to you. Edit any time.':'Start here. Everything else is judged against this.'}</p></div>
  <form class="stack" data-form="profile" data-submit="profile-save" novalidate>
    <section class="card"><h3>Color</h3>${SEL('Color season','season',d.season,[['','Choose a season'],...SEASON_NAMES])}
      ${d.season?palHTML(d.season):'<p class="hint">Pick the season from your color analysis to see its palette. Not sure? Choose the closest and change it later.</p>'}
      ${aiOK()&&S.ai.images?`<div class="row">${FILE('Estimate from a daylight selfie','selfie','accept="image/*"','ghost small')}</div><p class="hint">Estimate, not a substitute for a draped analysis. The selfie goes to Claude once and is not saved.</p>`:''}
      ${e?`<div class="card"><h3>Estimate, not a substitute for a draped analysis</h3><p><b>${esc(e.season)}</b> · ${esc(e.confidence)} confidence${e.runner_up&&e.runner_up!==e.season?` · runner-up ${esc(e.runner_up)}`:''}</p><p class="hint">${esc(e.why)}</p><div class="row"><button type="button" class="btn small" data-act="selfie-use">Use ${esc(e.season)}</button></div></div>`:''}
      ${SEL('Metals','metals',d.metals,[['','Choose'],...METALS])}</section>
    <section class="card"><h3>Style and fit</h3>${SEL('Shop in','department',d.department,[['','No preference'],["men's",'Menswear'],["women's",'Womenswear']])}${F('Style direction, 3 to 5 words','style',d.style,'maxlength="80" placeholder="relaxed tailored earthy workwear"')}
      <div class="grid2">${F('Height','height',d.height,'maxlength="20" placeholder="5 ft 10"')}${F('Build','build',d.build,'maxlength="40" placeholder="athletic, broad shoulders"')}</div>
      ${TA('Measurements','measurements',d.measurements,'chest 40, waist 32, inseam 30, shoulder 18.5')}${TA('Sizes by brand','sizes',d.sizes,'Uniqlo M · Levi\'s 32x30 · Nike 10.5')}${TA('Fit problems','fit_problems',d.fit_problems,'sleeves run long, thighs tight in slim cuts')}${TA("Hard no's",'hard_nos',d.hard_nos,'skinny jeans, logos, silver hardware')}</section>
    <section class="card"><h3>Budget per piece, in dollars</h3><div class="grid2">${BUDGETS.map(b=>F(b[0].toUpperCase()+b.slice(1),'budget_'+b,d.budgets[b]??'','type="number" inputmode="numeric" min="0" max="100000" placeholder="0"')).join('')}</div></section>
    <div class="row"><button class="btn" type="submit">Save profile</button></div>
  </form>
  <section class="card"><h3>Your data</h3><p class="hint">Signed in as ${esc(S.email)}. Only you can read your closet through the app; whoever runs this site administers the database.</p>
    <div class="row"><button class="btn ghost small" data-act="data-export">Export my data</button><button class="btn danger small" data-act="data-delete">Delete my data</button><button class="btn ghost small" data-act="sign-out">Sign out</button></div></section>`}
function syncProfile(f){const d=formData(f),p=S.pdraft||(S.pdraft=blankProfile());['season','metals','department','style','height','build','measurements','sizes','fit_problems','hard_nos'].forEach(k=>{p[k]=String(d[k]??'')});
  p.budgets={};BUDGETS.forEach(b=>{const v=Math.round(Number(d['budget_'+b]));if(v>0)p.budgets[b]=v})}
async function profileSave(){const f=$('form[data-form=profile]');if(f)syncProfile(f);const d=S.pdraft;
  if(!d.season){toast('Choose a color season first.');return}
  const words=d.style.trim().split(/\s+/).filter(Boolean).length,first=!S.profile;
  S.profile={...(S.profile||{}),...d,style:d.style.trim(),updated:Date.now()};S.pdraft=null;S.selfie=null;
  if(first)go('closet');else render();
  try{await save(P.profile(),S.profile);toast(words&&(words<3||words>5)?'Saved. Style direction works best at 3 to 5 words.':first?'Profile saved. Now add your first pieces.':'Profile saved.')}catch(e){}}
async function selfie(files){let url;try{url=await shrink(files[0],900,400000)}catch(e){toast("That photo couldn't be opened. Try a JPEG or PNG.");return}
  try{const r=await ask('Estimating your season',selfiePrompt(),{images:[dataBlob(url)]});
    const s=SEASON_NAMES.find(n=>n.toLowerCase()===String(r&&r.season||'').toLowerCase());if(!s){toast("Claude couldn't settle on a season from that photo. Try one in daylight.");return}
    S.selfie={season:s,runner_up:SEASON_NAMES.find(n=>n.toLowerCase()===String(r.runner_up||'').toLowerCase())||'',confidence:oneOf(r.confidence,['low','medium','high'],'low'),why:String(r.why||'').slice(0,300)};render()}
  catch(e){if(!e.handled)toast("The estimate didn't come back. Try again with a daylight photo.")}}
function exportData(){const pack=strip=>JSON.stringify({app:'Fit Check',exported_at:new Date().toISOString(),profile:S.profile,insights:S.insights,items:strip?S.items.map(({photo,...r})=>r):S.items,inspiration:strip?S.inspo.map(({photo,...r})=>r):S.inspo,outfits:S.outfits,wear_log:strip?S.wears.map(({photo,...r})=>r):S.wears},null,1);
  saveFile('fit-check-export.json',pack(false))}
async function deleteData(){closeSheet();busy('Deleting your data','');
  try{must(await sb.from('docs').delete().eq('user_id',S.uid))}catch(e){busy();toast("Deleting didn't go through. Check your connection and try again.");return}
  busy();last.clear();S.profile=null;S.insights={};S.items=[];S.inspo=[];S.outfits=[];S.wears=[];S.buyResult=null;S.buy={url:'',photo:''};S.suggestion=null;S.pdraft=null;S.selfie=null;go('profile');toast('Your profile, closet, inspiration, outfits and wear log are deleted.')}

/* ---------- Feedback ---------- */
function feedbackSheet(){openSheet(`<form data-form="fb" data-submit="feedback-send" novalidate><h2>Send feedback</h2><p class="hint">About the ${LABEL[S.view]} screen. Only the owner of this app can read it.</p>
  <label class="f" for="fb-text"><span>What worked, what broke, what's missing?</span><textarea id="fb-text" name="text" rows="5" maxlength="2000"></textarea></label>
  <div class="f"><span id="fb-rl">Rating (optional)</span><div class="stars" role="group" aria-labelledby="fb-rl">${[1,2,3,4,5].map(n=>`<button type="button" class="btn ghost small" data-act="fb-rate" data-v="${n}" aria-pressed="false">${n}</button>`).join('')}</div><input type="hidden" name="rating" id="fb-rating" value=""></div>
  <div class="row"><button class="btn" type="submit">Send</button><button class="btn ghost" type="button" data-act="sheet-close">Cancel</button></div></form>`)}
async function feedbackSend(){const f=$('form[data-form=fb]');if(!f)return;const d=formData(f),text=d.text.trim();if(!text){toast('Write a line of feedback first.');return}
  try{must(await withTimeout(sb.from('feedback').insert({user_id:S.uid,email:S.email,body:text.slice(0,2000),rating:Number(d.rating)||null,view:S.view}),10000));
    closeSheet();toast('Sent. Thank you.');if(S.isOwner){S.fb.list=null;if(S.view==='feedback')loadFeedback()}}
  catch(e){toast("That didn't send. Check your connection and try again.")}}
async function loadFeedback(){S.fb={list:null,err:'',loading:true};render();
  try{const rows=must(await withTimeout(sb.from('feedback').select('email,body,rating,view,created_at').order('created_at',{ascending:false}).limit(500),10000));
    S.fb={list:rows.map(r=>({who:r.email,text:r.body,rating:r.rating,view:r.view,at:Date.parse(r.created_at)})),err:''}}
  catch(e){S.fb={list:null,err:e&&e.code==='timeout'?'Feedback is taking longer than 10 seconds to load.':"Feedback didn't load."}}
  if(S.view==='feedback')render()}
function feedbackView(){const fb=S.fb;let h=`<div class="head"><h1>Feedback</h1><p class="sub">${fb.list?`${fb.list.length} entr${fb.list.length===1?'y':'ies'}, newest first · only you see this tab`:'Only you see this tab'}</p></div>`;
  if(fb.err)return h+`<section class="empty"><h2>Not loaded</h2><p>${esc(fb.err)}</p><button class="btn small" data-act="fb-reload">Retry</button></section>`;
  if(!fb.list)return h+`<p class="hint">Loading feedback…</p>`;
  if(!fb.list.length)return h+`<section class="empty"><h2>No feedback yet</h2><p>Share the link with friends. Every screen has a Send feedback button, and what they write lands here.</p><button class="btn small" data-act="fb-reload">Refresh</button></section>`;
  return h+`<div class="row"><button class="btn ghost small" data-act="fb-reload">Refresh</button></div><div>${fb.list.map(r=>{return`<div class="fbrow"><div class="meta"><b>${esc(r.who===S.email?'You':r.who||'Someone')}</b><span>${esc(LABEL[r.view]||r.view||'')}</span>${r.rating?`<span>${esc(r.rating)}/5</span>`:''}<span>${r.at?new Date(r.at).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}</span></div><p>${esc(r.text)}</p></div>`}).join('')}</div>`}

/* ---------- sign-in ---------- */
function authView(){return`<div class="head"><h1>Fit Check</h1><p class="sub">Your closet, your palette, outfits from what you own.</p></div>
  <form class="card" data-form="auth" data-submit="auth-in" novalidate><h3>Sign in or create an account</h3>
    ${F('Email','email','','type="email" autocomplete="email" required')}${F('Password, 8 characters or more','password','','type="password" autocomplete="current-password" minlength="8" required')}
    <p class="hint" id="auth-note">${esc(S.authNote||'')}</p>
    <div class="row"><button class="btn" type="submit">Sign in</button><button class="btn ghost" type="button" data-act="auth-up">Create account</button></div></form>
  <p class="hint">Each account gets its own private profile, closet, inspiration and outfits.</p>`}
async function authGo(signUp){const f=$('form[data-form=auth]');if(!f)return;const d=formData(f),email=d.email.trim(),password=d.password;
  const note=t=>{S.authNote=t;const n=$('#auth-note');if(n)n.textContent=t};
  if(!/^\S+@\S+\.\S+$/.test(email)){note('Enter your email address.');return}
  if(password.length<8){note('Use a password of 8 characters or more.');return}
  note(signUp?'Creating your account…':'Signing in…');
  try{const r=signUp?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email,password});
    if(r.error){note(/invalid login/i.test(r.error.message)?"That email and password don't match. New here? Tap Create account.":/registered/i.test(r.error.message)?'That email already has an account. Tap Sign in.':r.error.message);return}
    if(!r.data.session)note('Check your email for a confirmation link, then come back and sign in.')}
  catch(e){note("Couldn't reach the sign-in service. Check your connection and try again.")}}
async function onSession(ses){
  if(ses&&ses.user){if(S.uid===ses.user.id)return;S.uid=ses.user.id;S.email=ses.user.email||'';S.authNote='';await loadAll()}
  else{S.uid=null;S.email='';S.isOwner=false;S.profile=null;S.insights={};S.items=[];S.inspo=[];S.outfits=[];S.wears=[];S.buyResult=null;S.buy={url:'',photo:''};S.suggestion=null;S.pdraft=null;S.fb={list:null,err:''};last.clear();S.phase='auth';render()}}

/* ---------- render and routing ---------- */
const VIEWS={closet:closetView,outfits:outfitsView,inspo:inspoView,shop:shopView,profile:profileView,feedback:feedbackView};
function render(){chrome();const v=$('#view');
  if(S.phase==='boot'||S.phase==='loading'){v.innerHTML='<section class="empty"><h2>Fit Check</h2><p>Opening your closet…</p></section>';return}
  if(S.phase==='setup'){v.innerHTML=`<section class="empty"><h2>Almost there</h2><p>${esc(S.loadErr)}</p></section>`;return}
  if(S.phase==='auth'){v.innerHTML=authView();return}
  if(S.phase==='error'){v.innerHTML=`<section class="empty"><h2>Not loaded yet</h2><p>${esc(S.loadErr)}</p><button class="btn" data-act="load-retry">Retry</button></section>`;return}
  v.innerHTML=walkHTML()+VIEWS[S.view]()}
const okView=v=>!!VIEWS[v]&&(v!=='feedback'||S.isOwner);
function enter(){if(S.view==='feedback'&&!S.fb.list&&!S.fb.loading&&S.phase==='ready')loadFeedback()}
function route(){const h=(location.hash||'').slice(1);S.view=okView(h)?h:(S.phase==='ready'&&!S.profile?'profile':okView(S.view)?S.view:'closet');enter()}
function go(v){S.view=okView(v)?v:'closet';try{if(location.hash!=='#'+S.view)location.hash=S.view}catch(e){}enter();render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{route();render()});

const ACT={
  go:t=>go(t.dataset.v),'auth-in':()=>authGo(false),'auth-up':()=>authGo(true),'sign-out':async()=>{try{await sb.auth.signOut()}catch(e){}},
  'load-retry':()=>loadAll(),'sheet-close':closeSheet,'ai-stop':()=>ctl&&ctl.abort(),
  'walk-dismiss':async()=>{S.profile={...S.profile,walkDismissed:true};render();try{await save(P.profile(),S.profile)}catch(e){}},
  'copy-src':async()=>{const el=$('#copy-src');try{await navigator.clipboard.writeText(el.value);toast('Copied.')}catch(e){el.focus();el.select();toast('Select the text and copy it.')}},
  'item-new':()=>openItem(blankItem(),true,'Fill in the details, then save.'),
  'item-edit':t=>{const i=itemBy(t.dataset.id);if(i)openItem(i,false,'')},
  'item-retag':()=>tagOpenItem(),'item-save':itemSave,
  'item-delete':t=>{if(t.dataset.sure){const id=E.orig.item_id;S.items=S.items.filter(x=>x.item_id!==id);closeSheet();render();remove(P.item(id)).catch(()=>toast("That didn't delete. Check your connection and try again."))}else{t.dataset.sure='1';t.textContent='Tap again to delete'}},
  'filters-clear':()=>{S.filters={category:'',palette_fit:'',season:'',formality:'',wear:''};render()},
  'csv-export':()=>saveFile('wardrobe.csv',toCSV()),
  'csv-open':()=>openSheet(`<form data-form="csv" data-submit="csv-import" novalidate><h2>Import wardrobe.csv</h2><p class="hint">Columns, in this order on export: ${CSV_COLS.join(', ')}. Rows with an item_id you already have are updated and keep their photo.</p><div class="row">${FILE('Choose a .csv file','csv-file','accept=".csv,text/csv,text/plain"','')}</div><label class="f" for="csv-text"><span>Or paste the CSV text</span><textarea id="csv-text" name="text" rows="6" placeholder="${CSV_COLS.join(',')}"></textarea></label><div class="row"><button class="btn" type="submit">Import pasted text</button><button class="btn ghost" type="button" data-act="sheet-close">Cancel</button></div></form>`),
  'csv-import':()=>{const t=$('#csv-text');if(t&&t.value.trim())importCSV(t.value);else toast('Paste the CSV text or choose a file.')},
  'inspo-read':inspoRead,'taste-build':tasteBuild,
  'inspo-open':t=>{const x=S.inspo.find(i=>i.id===t.dataset.id);if(x)inspoSheet(x)},
  'inspo-recreate':t=>inspoRecreate(t.dataset.id),
  'recreate-save':async t=>{const x=S.inspo.find(i=>i.id===t.dataset.id);if(!x||!x.recreate)return;const o={id:'o'+rid(),items:x.recreate.items,reason:x.recreate.reason,swap:null,gap:x.recreate.missing?[x.recreate.missing.color,x.recreate.missing.item].filter(Boolean).join(' '):null,occasion:'From a saved look',temp:'',anchor:'',created:Date.now(),status:null};S.outfits.push(o);closeSheet();go('outfits');try{await save(P.outfit(o.id),o);toast('Saved to Outfits.')}catch(e){}},
  'inspo-delete':t=>{if(t.dataset.sure){const id=t.dataset.id;S.inspo=S.inspo.filter(x=>x.id!==id);closeSheet();render();remove(P.inspo(id)).catch(()=>{})}else{t.dataset.sure='1';t.textContent='Tap again to delete'}},
  occasion:t=>{S.oform.occasion=t.dataset.v;render()},
  'outfit-build':()=>outfitBuild(false),'outfit-again':()=>outfitBuild(true),
  'outfit-save':async()=>{const s=S.suggestion;if(!s)return;const o={id:'o'+rid(),...s,created:Date.now(),status:null};S.outfits.push(o);S.suggestion=null;render();try{await save(P.outfit(o.id),o);toast('Saved. Log it after you wear it.')}catch(e){}},
  'outfit-log':async t=>{const o=S.outfits.find(x=>x.id===t.dataset.id);if(!o)return;const v=t.dataset.v;if(o.status===v){o.status=null;o.ratedAt=null}else{o.status=v;o.ratedAt=Date.now()}render();try{await save(P.outfit(o.id),o)}catch(e){}},
  'outfit-delete':t=>{if(t.dataset.sure){const id=t.dataset.id;S.outfits=S.outfits.filter(x=>x.id!==id);render();remove(P.outfit(id)).catch(()=>{})}else{t.dataset.sure='1';t.textContent='Tap again'}},
  'fit-manual':()=>{FIT={photo:'',rating:null,note:'',worn:[],fresh:[]};fitSheet()},'fit-save':fitSave,
  'wear-delete':t=>{if(t.dataset.sure){const id=t.dataset.id;S.wears=S.wears.filter(x=>x.id!==id);render();remove(P.wear(id)).catch(()=>{})}else{t.dataset.sure='1';t.textContent='Tap again'}},
  'buy-check':buyCheck,'buy-clear':()=>{S.buyResult=null;render()},
  'buy-add':()=>{const r=S.buyResult;if(r)openItem({...blankItem(),...r.item,price:r.price||'',photo:r.photo||''},true,'From your buy-check. Adjust anything, then save.')},
  'gaps-find':gapsFind,'profile-save':profileSave,
  'selfie-use':()=>{const f=$('form[data-form=profile]');if(f)syncProfile(f);S.pdraft.season=S.selfie.season;S.selfie=null;render();toast('Season set. Save the profile to keep it.')},
  'data-export':exportData,
  'data-delete':()=>openSheet(`<h2>Delete all your data?</h2><p class="hint">This removes your profile, ${S.items.length} piece${S.items.length===1?'':'s'}, ${S.inspo.length} screenshot${S.inspo.length===1?'':'s'} ${S.outfits.length} outfit${S.outfits.length===1?'':'s'} and ${S.wears.length} wear log entr${S.wears.length===1?'y':'ies'}. It can't be undone. Feedback you already sent stays with the owner.</p><div class="row"><button class="btn danger" data-act="data-delete-yes">Delete everything</button><button class="btn ghost" data-act="sheet-close">Keep my data</button></div>`),
  'data-delete-yes':deleteData,
  'feedback-open':feedbackSheet,'feedback-send':feedbackSend,'fb-reload':loadFeedback,
  'fb-rate':t=>{const cur=$('#fb-rating'),v=cur.value===t.dataset.v?'':t.dataset.v;cur.value=v;t.parentNode.querySelectorAll('button').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})},
};
const FILES={
  'item-photo':async files=>{let url;try{url=await shrink(files[0])}catch(e){toast("That photo couldn't be opened. Try a JPEG or PNG.");return}
    const d=blankItem();d.photo=url;const can=aiOK()&&S.ai.images&&!aiWait()&&!S.ai.busy;openItem(d,true,can?'':'Fill in the details, then save.');if(can)tagOpenItem()},
  'item-rephoto':async files=>{if(!E)return;try{E.photo=await shrink(files[0])}catch(e){toast("That photo couldn't be opened. Try a JPEG or PNG.");return}const s=$('#item-ph');if(s)s.innerHTML=`<img class="ph" src="${E.photo}" alt="Photo of this piece">`},
  'inspo-add':inspoAdd,selfie,'fit-photo':fitPhoto,
  'buy-photo':async files=>{try{S.buy.photo=await shrink(files[0])}catch(e){toast("That image couldn't be opened. Try a JPEG or PNG.");return}render()},
  'csv-file':async files=>{try{importCSV(await files[0].text())}catch(e){toast("That file couldn't be read.")}},
};
document.addEventListener('click',e=>{if(e.target.id==='scrim'){closeSheet();return}const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const fn=ACT[t.dataset.act];if(fn&&!(t.type==='submit'&&t.form)){e.preventDefault();fn(t)}});
document.addEventListener('submit',e=>{e.preventDefault();const fn=ACT[e.target.dataset.submit];if(fn)fn(e.target)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.matches('input[type=file][data-file]')){const files=[...t.files],k=t.dataset.file;t.value='';if(files.length&&FILES[k])FILES[k](files);return}
  if(t.dataset.filter){S.filters[t.dataset.filter]=t.value;render();return}
  if(t.form&&t.form.dataset.form==='profile'&&t.name==='season'){syncProfile(t.form);render()}});
document.addEventListener('input',e=>{const t=e.target,f=t.form;if(!f||!t.name)return;
  if(f.dataset.form==='profile')syncProfile(f);else if(f.dataset.form==='outfit')S.oform[t.name]=t.value;else if(f.dataset.form==='buy')S.buy[t.name]=t.value;else if(f.dataset.form==='item'&&E)E.dirty.add(t.name)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scrim').classList.contains('open'))closeSheet()});

/* ---------- boot ---------- */
async function boot(){
  render();
  let cfg=null;try{const r=await withTimeout(fetch('/api/config'),10000);cfg=r.ok?await r.json():null}catch(e){}
  if(!cfg||!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){S.phase='setup';S.loadErr="This site isn't connected to its database yet. If you run it, set SUPABASE_URL and SUPABASE_ANON_KEY in Vercel and redeploy (see the README).";render();return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
  sb.auth.onAuthStateChange((_e,ses)=>{setTimeout(()=>onSession(ses),0)});   /* deferred: never await Supabase calls inside this callback */
}
boot().catch(()=>{S.phase='error';S.loadErr='Fit Check hit a snag while starting. Retry in a moment.';render()});
})();
</script>
